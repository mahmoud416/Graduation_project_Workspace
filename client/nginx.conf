# Nginx config for the Orbit Workspace SPA.
# - Serves the Vite build with history-API fallback.
# - Proxies /api/v1 and /ws to the backend service (used in compose/k8s).
#   The backend host defaults to "backend:8000"; override the upstream by
#   replacing this file or via the BACKEND_URL substitution in k8s.

upstream orbit_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API → backend
    location /api/ {
        proxy_pass http://orbit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket → backend
    location /ws {
        proxy_pass http://orbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
