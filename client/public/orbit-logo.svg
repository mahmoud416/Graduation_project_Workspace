<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#a)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
  <!-- Center dot (planet) -->
  <circle cx="32" cy="32" r="6" fill="white"/>
  <!-- Orbiting dot top-right -->
  <circle cx="50" cy="18" r="3.5" fill="white" opacity="0.9"/>
  <!-- Orbiting dot bottom-left -->
  <circle cx="14" cy="46" r="2.5" fill="white" opacity="0.5"/>
  <!-- Orbit arc line -->
  <path d="M 14 32 Q 32 8 50 32 Q 32 56 14 32" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</svg>
