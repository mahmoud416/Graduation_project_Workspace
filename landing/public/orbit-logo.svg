<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cg" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="55%"  stop-color="#1a6fff"/>
      <stop offset="100%" stop-color="#0a1aff"/>
    </radialGradient>
    <radialGradient id="s1" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </radialGradient>
    <radialGradient id="s2" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#1a6fff"/>
    </radialGradient>
    <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a6fff" stop-opacity=".95"/>
      <stop offset="50%"  stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#1a6fff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="r2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity=".85"/>
      <stop offset="50%"  stop-color="#1a6fff"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity=".3"/>
    </linearGradient>
    <filter id="gf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer tilted ring -->
  <ellipse cx="32" cy="32" rx="27" ry="9.5"
    fill="none" stroke="url(#r2)" stroke-width="1.6"
    transform="rotate(-38 32 32)" opacity=".92"/>
  <!-- inner ring -->
  <ellipse cx="32" cy="32" rx="21" ry="7.5"
    fill="none" stroke="url(#r1)" stroke-width="1.6"
    transform="rotate(24 32 32)" opacity=".92"/>
  <!-- central planet -->
  <circle cx="32" cy="32" r="10" fill="url(#cg)" filter="url(#gf)"/>
  <!-- highlight -->
  <ellipse cx="29" cy="28" rx="4" ry="2.5" fill="white" opacity=".18" transform="rotate(-20 29 28)"/>
  <!-- orbital sphere 1 (top-right) -->
  <circle cx="51" cy="19" r="4"   fill="url(#s1)" filter="url(#sf)"/>
  <!-- orbital sphere 2 (bottom-left) -->
  <circle cx="14" cy="47" r="2.8" fill="url(#s2)"/>
  <!-- orbital sphere 3 (right side) -->
  <circle cx="52" cy="41" r="2.3" fill="#00aaff" opacity=".88"/>
</svg>
