apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: orbit
data:
  MONGODB_DB_NAME: "orbitdb"
  APP_NAME: "Orbit Workspace"
  APP_VERSION: "2.0.0"
  DEBUG: "false"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "480"
  GEMINI_MODEL: "gemini-2.0-flash"
  RAG_ENABLED: "true"
  CHROMA_PERSIST_DIR: "/app/chroma_data"
  EMBEDDING_MODEL: "models/text-embedding-004"
  # Public origins allowed by CORS — adjust to your domain
  ALLOWED_ORIGINS: "https://orbit.example.com,http://localhost:5173"
---
# NOTE: This is a TEMPLATE. Do NOT commit real secrets.
# Create the real secret with:
#   kubectl -n orbit create secret generic backend-secret \
#     --from-literal=MONGO_URI='mongodb+srv://...' \
#     --from-literal=JWT_SECRET_KEY='...' \
#     --from-literal=GEMINI_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: orbit
type: Opaque
stringData:
  MONGO_URI: "REPLACE_WITH_MONGODB_ATLAS_URI"
  JWT_SECRET_KEY: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
