apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit-ingress
  namespace: orbit
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    # Uncomment with cert-manager for automatic TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: ["orbit.example.com", "app.orbit.example.com"]
  #     secretName: orbit-tls
  rules:
    # ── Marketing landing page (the first page users open) ──────
    - host: orbit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80

    # ── Product app + API (the "Login" button lands here) ───────
    - host: app.orbit.example.com
      http:
        paths:
          # REST API → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # WebSocket → backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Everything else → SPA frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
